<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wiki Trails</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icons/32.png" alt="" width="20" height="20"><b>Wiki Trails</b></header>
  <p class="status" id="status">…</p>
  <p class="today" id="today"></p>
  <label class="switch"><input type="checkbox" id="on"> Record the Wikipedia pages I open</label>
  <p class="sync" id="sync"></p>
  <details id="manual" hidden>
    <summary>Connect here instead</summary>
    <input id="repo" placeholder="your-name/wiki-trails-data" spellcheck="false" autocomplete="off">
    <input id="token" type="password" placeholder="Access token (github_pat_…)" spellcheck="false" autocomplete="off">
    <button id="connect">Connect</button>
    <p class="err" id="err" hidden></p>
  </details>
  <button id="open" class="primary">Open Wiki Trails</button>
  <p class="note">Only Wikipedia articles are recorded. They go to your own GitHub repository and nowhere else.</p>
  <script src="popup.js"></script>
</body>
</html>
